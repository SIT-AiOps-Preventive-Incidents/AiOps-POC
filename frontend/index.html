<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <title>RadarOps</title>
  <script>
    // apply the saved theme before the first paint (no white flash in dark mode)
    try {
      var t = (JSON.parse(localStorage.getItem("aiops.prefs")) || {}).theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#000000");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
