# Edge load balancer: round-robin across frontend replicas.
load_module modules/ngx_otel_module.so;
worker_processes 1;
events { worker_connections 1024; }

http {
  otel_exporter { endpoint otel-collector:4317; }
  otel_service_name edge-lb;
  otel_trace on;
  otel_trace_context propagate;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream frontend_pool {
    zone frontend_pool 64k;
    server frontend-a:8000 resolve max_fails=2 fail_timeout=10s;
    server frontend-b:8000 resolve max_fails=2 fail_timeout=10s;
  }

  log_format lbjson escape=json '{"device":"edge-lb","src_ip":"$http_x_forwarded_for","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_rt":"$upstream_response_time","rt":$request_time,"trace_id":"$otel_trace_id"}';
  access_log /var/log/edge/lb.log lbjson buffer=16k flush=2s;
  error_log /dev/stderr warn;

  server {
    listen 80;
    location / {
      proxy_pass http://frontend_pool;
      # Retry on connection failures only (instance restarting / down). App 5xx responses pass through,
      # so the logs still show which instance is failing.
      proxy_next_upstream error timeout non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
  }
}
