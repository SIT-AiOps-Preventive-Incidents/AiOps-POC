# Edge firewall (simulated perimeter / WAF). Deny list is managed by the AIOps
# remediation executor (edge/blocklist.conf) - only after owner approval.
load_module modules/ngx_otel_module.so;
worker_processes 1;
events { worker_connections 1024; }

http {
  otel_exporter { endpoint otel-collector:4317; }
  otel_service_name edge-firewall;
  otel_trace on;
  otel_trace_context propagate;

  resolver 127.0.0.11 valid=10s ipv6=off;

  geo $http_x_forwarded_for $blocked {
    default 0;
    include /etc/nginx/edge/blocklist.conf;
  }
  map $blocked $fw_action { 1 DENY; default ALLOW; }

  log_format fwjson escape=json '{"device":"edge-firewall","src_ip":"$http_x_forwarded_for","action":"$fw_action",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"rt":$request_time,"trace_id":"$otel_trace_id"}';
  access_log /var/log/edge/firewall.log fwjson buffer=16k flush=2s;
  error_log /dev/stderr warn;

  server {
    listen 80;
    set $lb http://edge-lb:80;
    location / {
      if ($blocked) { return 403 '{"error":"blocked by firewall policy"}'; }
      proxy_pass $lb;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header Host $host;
    }
  }
}
