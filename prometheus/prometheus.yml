global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-push
    static_configs:
      - targets: ["otel-collector:8890"]

  # Hosts registered through "Connect Infrastructure" in the web app.
  # aiops-api writes targets/infra.json; Prometheus re-reads it every 15s.
  - job_name: infra
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 15s
