<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>AIOps One</title>
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<aside id="nav">
  <div class="brand">
    <div class="logo"><span class="fi" style="--i:url('/static/icons/f/pulse_filled.svg');color:#fff;width:20px;height:20px"></span></div>
    <div><b>AIOps One</b><span>Incident intelligence</span></div>
  </div>
  <nav id="menu"></nav>
  <div class="navfoot" id="navfoot"></div>
</aside>
<main>
  <header id="top">
    <button id="menubtn" aria-label="Open menu" onclick="document.body.classList.toggle('navopen')"><span class="fi" style="--i:url('/static/icons/f/list_regular.svg');width:24px;height:24px"></span></button>
    <div class="chips" id="chips"></div>
    <div class="chips"><a id="grafana" class="btn plain sm" target="_blank" rel="noopener"><img class="blogo" src="/static/icons/b/grafana.svg" width="16" height="16" alt="">Grafana</a></div>
  </header>
  <section id="view"></section>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"><button class="x" aria-label="Close" onclick="closeModal()">&times;</button><div id="modal-body"></div></div></div>
<div id="toast" role="status"></div>
<script src="/static/app.js?v=5"></script>
</body>
</html>
