name: aiops

x-demo: &demo
  build: ./demo-apps
  image: aiops-demo-app:latest
  restart: unless-stopped
  mem_limit: 256m
  networks: [aiops]

services:
  # ---------------- Observability (namespace "obs") ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-collector
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
      - edge-logs:/var/log/edge:ro
    ports: ["4317:4317", "4318:4318"]
    restart: unless-stopped
    mem_limit: 384m
    networks: [aiops]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=8d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    mem_limit: 512m
    networks: [aiops]

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./loki/config.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
    restart: unless-stopped
    mem_limit: 512m
    networks: [aiops]

  tempo:
    image: grafana/tempo:2.8.1
    container_name: tempo
    user: "0"
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./tempo/config.yaml:/etc/tempo/config.yaml:ro", "tempo-data:/var/tempo"]
    environment:
      GOMEMLIMIT: 800MiB  # GC before the cgroup limit; 512m was OOM-killed under load
    restart: unless-stopped
    mem_limit: 1g
    networks: [aiops]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3001:3000"]
    restart: unless-stopped
    mem_limit: 256m
    networks: [aiops]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped
    mem_limit: 64m
    networks: [aiops]

  # ---------------- Agentic AI (namespace "agentic-ai") ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped
    mem_limit: 3g
    cpus: 3.0
    networks: [aiops]

  # ---------------- Platform web app (namespace "app") ----------------
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops  # internal network only, not published
      POSTGRES_DB: aiops
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aiops"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    networks: [aiops]

  aiops-api:
    build: {context: ., dockerfile: aiops-api/Dockerfile}
    image: aiops-api:latest
    container_name: aiops-api
    environment:
      DB_PATH: /data/aiops.db
      PROM_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      OLLAMA_URL: http://ollama:11434
      TARGETS_DIR: /targets
      PUBLIC_URL: ${PUBLIC_URL:-http://cp26pt1.sit.kmutt.ac.th:8080}
      GRAFANA_URL: ${GRAFANA_URL:-http://cp26pt1.sit.kmutt.ac.th:3001}
      DATABASE_URL: postgresql://aiops:aiops@postgres:5432/aiops
      PLATFORM_HOST: cp26pt1
      DEMO_DATASET: ${DEMO_DATASET:-shop}          # shop | anomod (replay/anomod/switch.sh sets it in .env)
      ANOMOD_REPLAY_URL: http://anomod-replay:8000
      RADAROPS_ADMIN_EMAIL: ${RADAROPS_ADMIN_EMAIL:-admin@radarops.local}   # first admin; password in /data/initial-admin-password
      SSO_REDIRECT_BASE: ${SSO_REDIRECT_BASE:-https://cp26pt1.sit.kmutt.ac.th:8443}   # single sign-on comes back over https
    extra_hosts: ["cp26pt1.sit.kmutt.ac.th:host-gateway"]   # reach the demo SSO provider at the same URL as browsers
    volumes:
      - api-data:/data
      - ./prometheus/targets:/targets
      - /var/run/docker.sock:/var/run/docker.sock
      - ./edge:/edge
      - edge-logs:/var/log/edge
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
      ollama: {condition: service_started}
    restart: unless-stopped
    mem_limit: 384m
    networks: [aiops]

  # ---------------- Customer demo services (instrumented with OTel) ----------------
  # ---------------- Customer network edge: firewall -> load balancer ----------------
  edge-fw:
    image: nginx:1.29.1-otel
    container_name: edge-fw
    volumes:
      - ./edge/fw.conf:/etc/nginx/nginx.conf:ro
      - ./edge:/etc/nginx/edge
      - edge-logs:/var/log/edge
    restart: unless-stopped
    mem_limit: 64m
    networks: [aiops]
  edge-lb:
    image: nginx:1.29.1-otel
    container_name: edge-lb
    volumes:
      - ./edge/lb.conf:/etc/nginx/nginx.conf:ro
      - ./edge:/etc/nginx/edge
      - edge-logs:/var/log/edge
    restart: unless-stopped
    mem_limit: 64m
    networks: [aiops]
    depends_on: [frontend-a, frontend-b]

  frontend-a:
    <<: *demo
    container_name: frontend-a
    environment: {SERVICE: frontend, INSTANCE: frontend-a, APP_VERSION: "1.2.0", APP_COMMIT: "9f3c2e1"}
  frontend-b:
    <<: *demo
    container_name: frontend-b
    environment: {SERVICE: frontend, INSTANCE: frontend-b, APP_VERSION: "1.2.0", APP_COMMIT: "9f3c2e1"}
  checkout:
    <<: *demo
    container_name: checkout
    environment: {SERVICE: checkout, APP_VERSION: "1.2.0", APP_COMMIT: "4b7d0a9"}
  payment:
    <<: *demo
    container_name: payment
    environment: {SERVICE: payment, APP_VERSION: "1.2.0", APP_COMMIT: "c81e5f2"}
  inventory:
    <<: *demo
    container_name: inventory
    environment: {SERVICE: inventory, APP_VERSION: "1.2.0", APP_COMMIT: "e2a94d7"}
  loadgen:
    <<: *demo
    container_name: loadgen
    environment: {SERVICE: loadgen}
    depends_on: [edge-fw, edge-lb, checkout, payment, inventory]

  # HTTPS in front of RadarOps (:8443), certificate from Caddy's own CA (the VM is not reachable from the internet, so
  # no public certificate). Single sign-on providers such as Google only send people back to an https address.
  https:
    image: caddy:2.8.4-alpine
    container_name: https
    command: ["caddy", "reverse-proxy", "--from", "https://cp26pt1.sit.kmutt.ac.th:8443", "--to", "aiops-api:8080", "--internal-certs"]
    ports: ["8443:8443"]
    volumes: ["caddy-data:/data"]
    mem_limit: 64m
    restart: unless-stopped
    networks: [aiops]

  # Demo single sign-on provider (OpenID Connect). Run sso/setup-dex.sh once first; it writes sso/dex.yaml.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes: ["./sso/dex.yaml:/etc/dex/config.yaml:ro"]
    ports: ["5556:5556"]
    mem_limit: 64m
    restart: unless-stopped
    profiles: ["sso"]
    networks: [aiops]

volumes:
  caddy-data:
  prom-data:
  loki-data:
  tempo-data:
  api-data:
  pg-data:
  edge-logs:
  ollama:
    external: true

networks:
  aiops:
    external: true
