# One node instead of AIOpsLab's two: the problems in problems.txt are application-level faults, and a single node
# leaves room on a 7 GB VM for the AIOps One stack that already runs there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-x86:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
